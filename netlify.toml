# netlify.toml at repository root
[build]
  base    = "."         # because the Vue project is at the repo root
  publish = "dist"      # tell Netlify to deploy the Vite build output
  command = "npm install && npm run build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  included_files = ["lib/**"]
  # Do not use esbuild here: it inlines @netlify/blobs and production
  # throws MissingBlobsEnvironmentError. Default zisi keeps the runtime hook.

# Confirm / unsubscribe must not fall through to the SPA.
[[redirects]]
  from = "/newsletter/confirm"
  to = "/.netlify/functions/newsletter-confirm"
  status = 200
  force = true

[[redirects]]
  from = "/newsletter/unsubscribe"
  to = "/.netlify/functions/newsletter-unsubscribe"
  status = 200
  force = true

# /games/<file>.html are the standalone game files (iframes). Netlify serves
# existing files before any non-forced rule, so they need no rule of their
# own. A "/games/*" rewrite used to sit here and answered 404 for every SPA
# route under /games that has no file behind it (the catalog itself and games
# that run on their own host, like /games/tiballz); those now fall through to
# the SPA catch-all at the end.

# Member console lives on console.brenon.cloud (home.cloud F1.6 / issue #8).
[[redirects]]
  from = "/console"
  to = "https://console.brenon.cloud/"
  status = 301
  force = true

[[redirects]]
  from = "/console/*"
  to = "https://console.brenon.cloud/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
