<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">
  <defs>
    <linearGradient id="bgAk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="540" fill="url(#bgAk)" rx="12"/>
  <text x="500" y="32" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="18" font-weight="bold">Authentik is the control plane</text>
  <text x="500" y="52" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">one box: who you are, what you may open, how the app talks</text>

  <rect x="300" y="70" width="400" height="52" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="bold">USER LIBRARY /if/user/</text>
  <text x="500" y="110" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">the portal — tiles you are allowed to see</text>

  <line x1="500" y1="122" x2="500" y2="148" stroke="#3b82f6" stroke-width="2"/>

  <g font-family="monospace">
    <rect x="40" y="148" width="220" height="88" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="150" y="176" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">APPLICATION</text>
    <text x="150" y="196" text-anchor="middle" fill="#cbd5e1" font-size="11">the tile</text>
    <text x="150" y="216" text-anchor="middle" fill="#64748b" font-size="10">slug, launch URL, group</text>

    <rect x="390" y="148" width="220" height="88" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="500" y="176" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">PROVIDER</text>
    <text x="500" y="196" text-anchor="middle" fill="#cbd5e1" font-size="11">how the tile talks</text>
    <text x="500" y="216" text-anchor="middle" fill="#64748b" font-size="10">OIDC, SAML, Proxy, LDAP</text>

    <rect x="740" y="148" width="220" height="88" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="850" y="176" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">GROUP</text>
    <text x="850" y="196" text-anchor="middle" fill="#cbd5e1" font-size="11">who sees the tile</text>
    <text x="850" y="216" text-anchor="middle" fill="#64748b" font-size="10">deny by default</text>
  </g>

  <line x1="150" y1="236" x2="150" y2="268" stroke="#64748b" stroke-width="1.5"/>
  <line x1="500" y1="236" x2="500" y2="268" stroke="#64748b" stroke-width="1.5"/>
  <line x1="850" y1="236" x2="850" y2="268" stroke="#64748b" stroke-width="1.5"/>

  <g font-family="monospace">
    <rect x="40" y="268" width="220" height="88" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="150" y="296" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="bold">FLOW</text>
    <text x="150" y="316" text-anchor="middle" fill="#cbd5e1" font-size="11">ordered stages</text>
    <text x="150" y="336" text-anchor="middle" fill="#64748b" font-size="10">login, enroll, recover</text>

    <rect x="390" y="268" width="220" height="88" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="500" y="296" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">STAGE</text>
    <text x="500" y="316" text-anchor="middle" fill="#cbd5e1" font-size="11">one step</text>
    <text x="500" y="336" text-anchor="middle" fill="#64748b" font-size="10">identify, password, MFA</text>

    <rect x="740" y="268" width="220" height="88" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="850" y="296" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="bold">POLICY</text>
    <text x="850" y="316" text-anchor="middle" fill="#cbd5e1" font-size="11">extra condition</text>
    <text x="850" y="336" text-anchor="middle" fill="#64748b" font-size="10">expression, reputation</text>
  </g>

  <rect x="40" y="380" width="920" height="72" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <g font-family="monospace" font-size="11">
    <text x="80" y="412" fill="#93c5fd">BRAND</text>
    <text x="80" y="432" fill="#64748b">login chrome</text>
    <text x="280" y="412" fill="#86efac">SOURCE</text>
    <text x="280" y="432" fill="#64748b">Google, LDAP later</text>
    <text x="520" y="412" fill="#c4b5fd">OUTPOST</text>
    <text x="520" y="432" fill="#64748b">proxy / LDAP at edge</text>
    <text x="760" y="412" fill="#fbbf24">BLUEPRINT / API</text>
    <text x="760" y="432" fill="#64748b">as-code catalog</text>
  </g>

  <text x="500" y="482" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13">Server + worker + Postgres + Redis. We run 2025.8.4 at auth.brenon.cloud.</text>
  <text x="500" y="506" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">A provider without an application is a dead OIDC client. We learned that the hard way.</text>
</svg>
