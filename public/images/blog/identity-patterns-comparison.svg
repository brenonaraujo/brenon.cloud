<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bgPat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#bgPat)" rx="12"/>
  <text x="500" y="34" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="18" font-weight="bold">How an app joins the IdP</text>

  <g font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="155" y="68" fill="#3b82f6">NATIVE OIDC</text>
    <text x="385" y="68" fill="#f59e0b">HYBRID</text>
    <text x="615" y="68" fill="#8b5cf6">PROXY + HOOK</text>
    <text x="845" y="68" fill="#94a3b8">PUBLIC</text>
  </g>
  <g font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">
    <text x="155" y="84">app speaks the protocol</text>
    <text x="385" y="84">OIDC plus local login</text>
    <text x="615" y="84">app has no OIDC</text>
    <text x="845" y="84">no login on purpose</text>
  </g>

  <g stroke="#374151" stroke-width="1">
    <line x1="30" y1="100" x2="970" y2="100"/>
    <line x1="30" y1="168" x2="970" y2="168"/>
    <line x1="30" y1="236" x2="970" y2="236"/>
    <line x1="30" y1="304" x2="970" y2="304"/>
    <line x1="270" y1="100" x2="270" y2="380"/>
    <line x1="500" y1="100" x2="500" y2="380"/>
    <line x1="730" y1="100" x2="730" y2="380"/>
  </g>

  <g font-family="monospace" font-size="10" fill="#64748b">
    <text x="40" y="140">Here</text>
    <text x="40" y="208">If IdP dies</text>
    <text x="40" y="276">Second form?</text>
    <text x="40" y="344">Use when</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
    <text x="155" y="140">Grafana, site</text>
    <text x="385" y="140">Portainer</text>
    <text x="615" y="140">n8n, MinIO, Draw</text>
    <text x="845" y="140">blog, games, status</text>

    <text x="155" y="208">app is down</text>
    <text x="385" y="208">local still works</text>
    <text x="615" y="208">app is down</text>
    <text x="845" y="208">n/a</text>

    <text x="155" y="276">no</text>
    <text x="385" y="276">yes, on purpose</text>
    <text x="615" y="276">no, after the hook</text>
    <text x="845" y="276">never a form</text>

    <text x="155" y="344">product supports it</text>
    <text x="385" y="344">break-glass needed</text>
    <text x="615" y="344">OSS with no OIDC</text>
    <text x="845" y="344">marketing / play</text>
  </g>
</svg>
