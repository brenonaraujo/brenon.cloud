<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430">
  <defs>
    <linearGradient id="bgCmp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="430" fill="url(#bgCmp)" rx="12"/>
  <text x="500" y="32" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="18" font-weight="bold">Open-source IdPs, for our job</text>
  <text x="500" y="52" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">not a bake-off score — why Authentik stayed the core</text>

  <g font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="175" y="78" fill="#3b82f6">AUTHENTIK</text>
    <text x="390" y="78" fill="#ef4444">KEYCLOAK</text>
    <text x="605" y="78" fill="#10b981">AUTHELIA</text>
    <text x="820" y="78" fill="#a78bfa">ZITADEL</text>
  </g>
  <g font-family="sans-serif" font-size="9" text-anchor="middle" fill="#64748b">
    <text x="175" y="94">IdP + portal</text>
    <text x="390" y="94">enterprise IAM</text>
    <text x="605" y="94">forward-auth</text>
    <text x="820" y="94">multi-tenant IAM</text>
  </g>

  <g stroke="#374151" stroke-width="1">
    <line x1="30" y1="108" x2="970" y2="108"/>
    <line x1="30" y1="168" x2="970" y2="168"/>
    <line x1="30" y1="228" x2="970" y2="228"/>
    <line x1="30" y1="288" x2="970" y2="288"/>
    <line x1="30" y1="348" x2="970" y2="348"/>
    <line x1="280" y1="108" x2="280" y2="400"/>
    <line x1="495" y1="108" x2="495" y2="400"/>
    <line x1="710" y1="108" x2="710" y2="400"/>
  </g>

  <g font-family="monospace" font-size="9" fill="#64748b">
    <text x="40" y="144">App library</text>
    <text x="40" y="204">Signup flows</text>
    <text x="40" y="264">OIDC clients</text>
    <text x="40" y="324">Forward-auth</text>
    <text x="40" y="384">Weight</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
    <text x="175" y="144">/if/user/ tiles</text>
    <text x="390" y="144">account console</text>
    <text x="605" y="144">no portal</text>
    <text x="820" y="144">projects / orgs</text>

    <text x="175" y="204">flow + stages</text>
    <text x="390" y="204">auth flows + SPI</text>
    <text x="605" y="204">YAML</text>
    <text x="820" y="204">login + actions</text>

    <text x="175" y="264">provider per app</text>
    <text x="390" y="264">client per realm</text>
    <text x="605" y="264">OIDC, thinner</text>
    <text x="820" y="264">apps in projects</text>

    <text x="175" y="324">outpost</text>
    <text x="390" y="324">extra proxy</text>
    <text x="605" y="324">the product</text>
    <text x="820" y="324">not the point</text>

    <text x="175" y="384">Django + PG</text>
    <text x="390" y="384">JVM, more RAM</text>
    <text x="820" y="384">Go, tenants</text>
    <text x="605" y="384">one Go binary</text>
  </g>
</svg>
