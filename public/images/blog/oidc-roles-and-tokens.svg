<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bgOidc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bgOidc)" rx="12"/>
  <text x="500" y="34" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="18" font-weight="bold">OIDC roles and the three tokens</text>
  <text x="500" y="56" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">OpenID Connect is identity on top of OAuth 2.0</text>

  <g font-family="monospace">
    <rect x="40" y="90" width="200" height="88" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="122" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">RESOURCE OWNER</text>
    <text x="140" y="144" text-anchor="middle" fill="#e2e8f0" font-size="13">the human</text>
    <text x="140" y="164" text-anchor="middle" fill="#64748b" font-size="10">browser + password</text>

    <rect x="400" y="90" width="200" height="88" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="500" y="122" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">RELYING PARTY</text>
    <text x="500" y="144" text-anchor="middle" fill="#e2e8f0" font-size="13">the app</text>
    <text x="500" y="164" text-anchor="middle" fill="#64748b" font-size="10">Grafana, site, proxy</text>

    <rect x="760" y="90" width="200" height="88" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="860" y="122" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">OPENID PROVIDER</text>
    <text x="860" y="144" text-anchor="middle" fill="#e2e8f0" font-size="13">the IdP</text>
    <text x="860" y="164" text-anchor="middle" fill="#64748b" font-size="10">Authentik</text>
  </g>

  <path d="M240 134 H400" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M600 134 H760" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="320" y="126" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">opens</text>
  <text x="680" y="126" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">authorize</text>

  <g font-family="sans-serif">
    <rect x="40" y="230" width="290" height="120" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="185" y="260" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="13" font-weight="bold">AUTHORIZATION CODE</text>
    <text x="185" y="286" text-anchor="middle" fill="#cbd5e1" font-size="12">one-shot, seconds long</text>
    <text x="185" y="308" text-anchor="middle" fill="#64748b" font-size="12">travels on the redirect</text>
    <text x="185" y="330" text-anchor="middle" fill="#64748b" font-size="12">useless without the verifier</text>

    <rect x="355" y="230" width="290" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="500" y="260" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="bold">ID TOKEN</text>
    <text x="500" y="286" text-anchor="middle" fill="#cbd5e1" font-size="12">JWT: who you are</text>
    <text x="500" y="308" text-anchor="middle" fill="#64748b" font-size="12">sub, email, name, iss, aud</text>
    <text x="500" y="330" text-anchor="middle" fill="#64748b" font-size="12">verify signature via JWKS</text>

    <rect x="670" y="230" width="290" height="120" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="815" y="260" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="13" font-weight="bold">ACCESS TOKEN</text>
    <text x="815" y="286" text-anchor="middle" fill="#cbd5e1" font-size="12">permission to call an API</text>
    <text x="815" y="308" text-anchor="middle" fill="#64748b" font-size="12">consoles barely use this</text>
    <text x="815" y="330" text-anchor="middle" fill="#64748b" font-size="12">machines use Kong keys</text>
  </g>

  <rect x="80" y="380" width="840" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="414" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">OAuth answers: may this app call that API?</text>
  <text x="500" y="440" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">OIDC answers: who is the human sitting in the browser?</text>
  <text x="500" y="462" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">The ID token is the extra claim. Without it you have delegated access, not login.</text>
</svg>
