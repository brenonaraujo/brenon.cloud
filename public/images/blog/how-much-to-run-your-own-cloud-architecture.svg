  <text x="230" y="444" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">4 CPU · 16.7 GB</text>
  <text x="230" y="466" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Swarm manager</text>
  <text x="230" y="488" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">room A</text>

  <rect x="430" y="372" width="340" height="150" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="600" y="400" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="13" font-weight="700">SERVER 2 · worker</text>
  <text x="600" y="422" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">former mining RIG · vserver</text>
  <text x="600" y="444" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">12 CPU · 67.4 GB</text>
  <text x="600" y="466" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">RTX 3080 + RTX 5080</text>
  <text x="600" y="488" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">room B</text>

  <rect x="800" y="372" width="340" height="150" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <text x="970" y="400" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="700">SERVER 3 · worker</text>
  <text x="970" y="422" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">small node</text>
  <text x="970" y="444" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="12">2 CPU · 8.1 GB</text>
  <text x="970" y="466" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">Swarm worker</text>
  <text x="970" y="488" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">room C</text>

  <!-- ethernet -->
  <line x1="400" y1="448" x2="430" y2="448" stroke="#38bdf8" stroke-width="2"/>
  <line x1="770" y1="448" x2="800" y2="448" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="538" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">wired LAN between rooms · not Wi-Fi</text>

  <!-- gpu / mining -->
  <rect x="430" y="552" width="340" height="72" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="580" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">GPUs 24/7 on PRL</text>
  <text x="600" y="602" text-anchor="middle" fill="#fde68a" font-family="monospace" font-size="12">energy ~US$ 80 · mining ~US$ 90</text>

  <!-- swarm services -->
  <rect x="60" y="640" width="710" height="72" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="415" y="668" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700">SWARM SERVICES</text>
  <text x="415" y="690" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">Authentik · Kong · Whisper STT · Chatterbox TTS · 23 stacks</text>

  <rect x="790" y="640" width="350" height="72" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="965" y="668" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="12" font-weight="700">FIREBASE FREE TIER</text>
  <text x="965" y="690" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">Clinicsy · Profitt · Firestore</text>

  <rect x="60" y="728" width="1080" height="50" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="758" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">ai.brenon.cloud · vserver.brenon.cloud · oficina.brenon.cloud · clinicsy.app · mentoria.devdojo.academy</text>
