<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="560" fill="url(#bgArch)" rx="12"/>
  <text x="500" y="32" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="18" font-weight="bold">Identity plane on Brenon.Cloud</text>

  <rect x="380" y="52" width="240" height="48" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <text x="500" y="72" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">BROWSER</text>
  <text x="500" y="90" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">human, one tab</text>

  <line x1="500" y1="100" x2="500" y2="122" stroke="#64748b" stroke-width="2"/>

  <rect x="340" y="122" width="320" height="44" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12">CLOUDFLARE TUNNEL</text>
  <text x="500" y="156" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">*.brenon.cloud</text>

  <line x1="500" y1="166" x2="500" y2="188" stroke="#64748b" stroke-width="2"/>

  <rect x="300" y="188" width="400" height="56" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="212" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="13" font-weight="bold">AUTHENTIK 2025.8.4</text>
  <text x="500" y="232" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">auth.brenon.cloud · library /if/user/</text>

  <line x1="180" y1="216" x2="300" y2="216" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="700" y1="216" x2="820" y2="216" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="180" y1="216" x2="180" y2="280" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="500" y1="244" x2="500" y2="280" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="820" y1="216" x2="820" y2="280" stroke="#3b82f6" stroke-width="1.5"/>

  <g font-family="monospace">
    <rect x="40" y="280" width="280" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="180" y="308" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">NATIVE / SITE</text>
    <text x="180" y="330" text-anchor="middle" fill="#cbd5e1" font-size="11">Grafana OIDC</text>
    <text x="180" y="350" text-anchor="middle" fill="#cbd5e1" font-size="11">brenon.cloud PKCE</text>
    <text x="180" y="368" text-anchor="middle" fill="#64748b" font-size="10">client talks to IdP</text>

    <rect x="360" y="280" width="280" height="100" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="500" y="308" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold">OAUTH2-PROXY</text>
    <text x="500" y="330" text-anchor="middle" fill="#cbd5e1" font-size="11">n8n + hook</text>
    <text x="500" y="350" text-anchor="middle" fill="#cbd5e1" font-size="11">MinIO + Draw</text>
    <text x="500" y="368" text-anchor="middle" fill="#64748b" font-size="10">app never sees the password</text>

    <rect x="680" y="280" width="280" height="100" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="820" y="308" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="bold">KONG KEY-AUTH</text>
    <text x="820" y="330" text-anchor="middle" fill="#cbd5e1" font-size="11">api.brenon.cloud</text>
    <text x="820" y="350" text-anchor="middle" fill="#cbd5e1" font-size="11">STT / TTS / machines</text>
    <text x="820" y="368" text-anchor="middle" fill="#64748b" font-size="10">not a human login</text>
  </g>

  <rect x="40" y="410" width="440" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="260" y="434" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13">Portainer sits on native OIDC</text>
  <text x="260" y="454" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">and keeps a local password as break-glass</text>

  <rect x="520" y="410" width="440" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="740" y="434" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13">Landings stay off this picture</text>
  <text x="740" y="454" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">blog, games, TibiaPixel play, status</text>

  <text x="500" y="500" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Groups on Authentik decide which tile you see. Billing, later, only writes groups.</text>
  <text x="500" y="526" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Catalog lives in brenon-cloud-identity. Apply against the LAN API, not Cloudflare.</text>
</svg>
