<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="40%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#132033"/>
    </linearGradient>
    <radialGradient id="glowA" cx="22%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="72%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="55%" cy="18%" r="28%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#glowC)"/>

  <!-- subtle grid -->
  <g opacity="0.10" stroke="#93c5fd" stroke-width="1">
    <path d="M0 180 H1920 M0 360 H1920 M0 540 H1920 M0 720 H1920 M0 900 H1920"/>
    <path d="M240 0 V1080 M480 0 V1080 M720 0 V1080 M960 0 V1080 M1200 0 V1080 M1440 0 V1080 M1680 0 V1080"/>
  </g>

  <!-- abstract cloud / node cluster left -->
  <g opacity="0.55" filter="url(#soft)">
    <circle cx="320" cy="780" r="120" fill="#1d4ed8"/>
    <circle cx="420" cy="820" r="90" fill="#0e7490"/>
    <circle cx="250" cy="860" r="70" fill="#4f46e5"/>
  </g>
  <g opacity="0.9" fill="none" stroke="#60a5fa" stroke-width="2">
    <circle cx="320" cy="760" r="18"/>
    <circle cx="410" cy="700" r="12"/>
    <circle cx="480" cy="780" r="14"/>
    <circle cx="360" cy="840" r="10"/>
    <path d="M320 760 L410 700 L480 780 L360 840 Z" stroke-opacity="0.55"/>
  </g>

  <!-- right stack cards -->
  <g transform="translate(1280 220)">
    <rect x="0" y="40" width="420" height="120" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <rect x="40" y="180" width="420" height="120" rx="16" fill="url(#panel)" stroke="#1d4ed8" stroke-width="2" opacity="0.95"/>
    <rect x="80" y="320" width="420" height="120" rx="16" fill="url(#panel)" stroke="#0e7490" stroke-width="2" opacity="0.9"/>
    <circle cx="70" cy="100" r="18" fill="#3b82f6" opacity="0.9"/>
    <circle cx="110" cy="240" r="18" fill="#22d3ee" opacity="0.9"/>
    <circle cx="150" cy="380" r="18" fill="#a78bfa" opacity="0.9"/>
    <rect x="110" y="88" width="240" height="10" rx="5" fill="#64748b" opacity="0.55"/>
    <rect x="110" y="112" width="160" height="8" rx="4" fill="#475569" opacity="0.45"/>
    <rect x="150" y="228" width="240" height="10" rx="5" fill="#64748b" opacity="0.55"/>
    <rect x="150" y="252" width="180" height="8" rx="4" fill="#475569" opacity="0.45"/>
    <rect x="190" y="368" width="240" height="10" rx="5" fill="#64748b" opacity="0.55"/>
    <rect x="190" y="392" width="140" height="8" rx="4" fill="#475569" opacity="0.45"/>
  </g>

  <!-- brand mark bottom-left -->
  <g transform="translate(96 920)">
    <rect width="56" height="56" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M16 36 L28 16 L40 36 Z" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="28" cy="30" r="3" fill="#38bdf8"/>
    <text x="72" y="28" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Brenon Cloud</text>
    <text x="72" y="52" fill="#64748b" font-family="ui-monospace, monospace" font-size="14">identity · services · home cloud</text>
  </g>
</svg>
